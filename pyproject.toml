[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speakwise"
version = "1.0.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "anthropic>=0.28",
    "openai>=1.30",
    "httpx>=0.27",
    "librosa>=0.10",
    "soundfile>=0.12",
    "praat-parselmouth>=0.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
    "cmudict>=1.0",
    "numpy<2.0",
]
local = [
    "speakwise[api]",
    "faster-whisper>=1.0",
    "kokoro>=0.3",
    "soundfile>=0.12",
]
test = [
    "speakwise[api]",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]
dev = [
    "speakwise[local]",
    "speakwise[test]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: hits real external APIs, needs API keys, excluded from CI",
]
