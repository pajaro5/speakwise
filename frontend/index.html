<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeakWise</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SpeakWise">
</head>
<body>
    <h1>🎙️ SpeakWise</h1>
    <p id="status"></p>

    <section id="start-screen">
        <button id="start-session-btn">Start session</button>
    </section>

    <section id="module-1" class="module hidden">
        <h2>Module 1 — Pronunciation</h2>
        <p id="pattern-name"></p>
        <p id="pattern-rule"></p>
        <p>Pronunciation: <strong id="pattern-ipa"></strong></p>
        <ul id="pattern-family"></ul>
        <div id="speed-control">
            Speed:
            <button id="speed-slow-btn">Slow</button>
            <button id="speed-normal-btn" class="speed-active">Normal</button>
            <button id="speed-fast-btn">Fast</button>
        </div>
        <button id="listen-pattern-btn">Listen to examples</button>
        <button id="practice-pattern-btn">🎙️ Record my attempt</button>
        <button id="next-to-module-2-btn" class="hidden">Next →</button>
    </section>

    <section id="module-2" class="module hidden">
        <h2>Module 2 — Chunk of the day</h2>
        <p><strong id="chunk-text"></strong></p>
        <p id="chunk-function"></p>
        <button id="listen-chunk-btn">Listen</button>
        <p id="chunk-examples-status"></p>
        <div id="chunk-examples">
            <p>✏️ <span id="chunk-example-sentence"></span></p>
            <p>📄 <span id="chunk-example-paragraph"></span></p>
            <p>💬 <span id="chunk-example-conversation"></span></p>
        </div>
        <button id="record-chunk-btn">🎙️ Use it in a sentence</button>
        <p id="chunk-feedback"></p>
        <button id="next-to-module-3-btn" class="hidden">Next →</button>
    </section>

    <section id="module-3" class="module hidden">
        <h2>Module 3 — Free conversation</h2>
        <div id="conversation-support">
            <p>Blanking out? Try these:</p>
            <p>To start: <span id="conversation-starters"></span></p>
            <p>Linking words: <span id="linking-words"></span></p>
            <p>Topics: <span id="topic-suggestions"></span></p>
        </div>
        <div id="chat-log"></div>
        <button id="record-btn">🎙️ Record</button>
    </section>

    <script src="app.js"></script>
</body>
</html>
