<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeakWise</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SpeakWise">
</head>
<body>
    <h1>🎙️ SpeakWise</h1>
    <p id="status"></p>

    <section id="start-screen">
        <button id="start-session-btn">Empezar sesión</button>
    </section>

    <section id="module-1" class="module hidden">
        <h2>Módulo 1 — Pronunciación</h2>
        <p id="pattern-name"></p>
        <p id="pattern-rule"></p>
        <p>Pronunciación: <strong id="pattern-ipa"></strong></p>
        <p id="pattern-family"></p>
        <button id="listen-pattern-btn">Escuchar ejemplos</button>
        <button id="practice-pattern-btn">🎙️ Grabar mi intento</button>
        <button id="next-to-module-2-btn" class="hidden">Siguiente →</button>
    </section>

    <section id="module-2" class="module hidden">
        <h2>Módulo 2 — Chunk del día</h2>
        <p id="chunk-text"></p>
        <p id="chunk-function"></p>
        <button id="listen-chunk-btn">Escuchar</button>
        <p id="chunk-examples-status"></p>
        <div id="chunk-examples">
            <p>Oración simple: <span id="chunk-example-sentence"></span></p>
            <p>Párrafo: <span id="chunk-example-paragraph"></span></p>
            <p>Conversación: <span id="chunk-example-conversation"></span></p>
        </div>
        <button id="record-chunk-btn">🎙️ Usarlo en una oración</button>
        <p id="chunk-feedback"></p>
        <button id="next-to-module-3-btn" class="hidden">Siguiente →</button>
    </section>

    <section id="module-3" class="module hidden">
        <h2>Módulo 3 — Conversación libre</h2>
        <div id="conversation-support">
            <p>¿Te quedás en blanco? Probá con:</p>
            <p>Para arrancar: <span id="conversation-starters"></span></p>
            <p>Conectores: <span id="linking-words"></span></p>
            <p>Temas: <span id="topic-suggestions"></span></p>
        </div>
        <button id="record-btn">🎙️ Grabar</button>
        <p id="transcript"></p>
        <p id="tutor-reply"></p>
        <audio id="tutor-audio" controls></audio>
    </section>

    <script src="app.js"></script>
</body>
</html>
